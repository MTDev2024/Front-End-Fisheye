<!doctype html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/photographer.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Découvrez nos photographes professionnels sur FishEye. Portraits, événements, paysages et plus."
    />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <title>Fisheye - Photographe</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img
          src="assets/images/logo.png"
          id="logo-2"
          class="logo"
          alt="Retour à l’accueil de Fisheye"
        />
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <!--  -->
      </div>

      <div class="Dropdown">
        <h2 id="sort-label">Trier par</h2>

        <div class="dropdown-wrapper">
          <!-- bouton principal -->
          <button
            id="dropdownButton"
            class="dropbtn"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="sort-label dropdownButton"
          >
            Popularité
            <img src="./assets/icons/expand_more-24px 4.png" alt="" />
          </button>

          <!-- liste des options -->
          <ul
            id="myDropdown"
            class="dropdown-content"
            role="listbox"
            aria-labelledby="sort-label"
          >
            <li role="option" aria-selected="true">
              <button>Popularité</button>
            </li>
            <li role="option"><button>Date</button></li>
            <li role="option"><button>Titre</button></li>
          </ul>
        </div>
      </div>

      <!-- Galerie -->
      <section class="photograph-gallery" aria-label="Galerie de medias">
        <!--  -->
      </section>
    </main>

    <!-- MODALE / OVERLAY -->
    <div
      id="contact_modal"
      aria-hidden="true"
      role="dialog"
      aria-labelledby="contact-title"
    >
      <div class="modal" role="document">
        <header>
          <h2 id="contact-title">
            Contactez-moi
            <p id="photographer-name"></p>
          </h2>
          <button
            class="modal-close"
            aria-label="Fermer le formulaire de contact"
          >
            <img src="assets/icons/close.svg" alt="" />
          </button>
        </header>

        <form id="form" aria-labelledby="contact-title" novalidate>
          <!-- Prénom -->
          <div>
            <label for="firstname">Prénom</label>
            <input
              type="text"
              id="firstname"
              name="firstname"
              minlength="2"
              required
            />
            <div
              id="firstname-error"
              class="form-error"
              aria-live="polite"
            ></div>
          </div>

          <!-- Nom -->
          <div>
            <label for="lastname">Nom</label>
            <input
              type="text"
              id="lastname"
              name="lastname"
              minlength="2"
              required
            />
            <div
              id="lastname-error"
              class="form-error"
              aria-live="polite"
            ></div>
          </div>

          <!-- Email -->
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <div id="email-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Message -->
          <div>
            <label for="message">Votre message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
            <div id="message-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Bouton -->
          <button type="submit" id="contact_form_submit">Envoyer</button>
          <div id="valid-message" aria-live="polite"></div>
        </form>
      </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Fermer" tabindex="0">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M195.2 195.2a64 64 0 0 1 90.496 0L512 421.504 738.304 195.2a64 64 0 0 1 90.496 90.496L602.496 512 828.8 738.304a64 64 0 0 1-90.496 90.496L512 602.496 285.696 828.8a64 64 0 0 1-90.496-90.496L421.504 512 195.2 285.696a64 64 0 0 1 0-90.496z"
          />
        </svg>
      </button>
      <button class="lightbox-prev" aria-label="Précédent" tabindex="0">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M685.248 104.704a64 64 0 010 90.496L368.448 512l316.8 316.8a64 64 0 01-90.496 90.496L232.704 557.248a64 64 0 010-90.496l362.048-362.048a64 64 0 0190.496 0z"
          />
        </svg>
      </button>
      <div class="lightbox-content"></div>
      <button class="lightbox-next" aria-label="Suivant">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M338.752 104.704a64 64 0 000 90.496l316.8 316.8-316.8 316.8a64 64 0 0090.496 90.496l362.048-362.048a64 64 0 000-90.496L429.248 104.704a64 64 0 00-90.496 0z"
          />
        </svg>
      </button>
    </div>

    <!-- LIKES / TJM -->
    <div class="container">
      <div class="likes"></div>
      <div class="tjm"></div>
    </div>

    <script type="module" src="scripts/pages/photographer.js"></script>
    <script type="module" src="scripts/utils/contactForm.js"></script>
  </body>
</html>
