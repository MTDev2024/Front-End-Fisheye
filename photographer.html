<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/photographer.css" />
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Découvrez nos photographes professionnels sur FishEye. Portraits, événements, paysages et plus."
    />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <title>Fisheye - Photographe</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img src="assets/images/logo.png" id="logo-2" class="logo" alt="Retour à l’accueil de Fisheye" >
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <button class="contact_button modal-btn">Contactez-moi</button>
      </div>
      <section class="photograph-gallery" aria-label="Galerie de medias">
      </section>

    </main>

    <!-- MODALE / OVERLAY -->
    <div
      id="contact_modal"
      aria-hidden="true"
      role="dialog"
      aria-labelledby="contact-title"
    >
      <div class="modal" role="document">
        <header>
          <h2 id="contact-title">
            Contactez-moi
            <p id="photographer-name"></p>
          </h2>
          <button
            class="modal-close"
            aria-label="Fermer le formulaire de contact"
          >
            <img src="assets/icons/close.svg" alt="" />
          </button>
        </header>

        <form id="form" aria-labelledby="contact-title" novalidate>
          <!-- Prénom -->
          <div>
            <label for="firstname">Prénom</label>
            <input
              type="text"
              id="firstname"
              name="firstname"
              minlength="2"
              required
            />
            <div
              id="firstname-error"
              class="form-error"
              aria-live="polite"
            ></div>
          </div>

          <!-- Nom -->
          <div>
            <label for="lastname">Nom</label>
            <input
              type="text"
              id="lastname"
              name="lastname"
              minlength="2"
              required
            />
            <div
              id="lastname-error"
              class="form-error"
              aria-live="polite"
            ></div>
          </div>

          <!-- Email -->
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <div id="email-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Message -->
          <div>
            <label for="message">Votre message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
            <div id="message-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Bouton -->
          <button type="submit" class="contact_button" id="contact_form_submit">
            Envoyer
          </button>
          <div id="valid-message" aria-live="polite"></div>
        </form>
      </div>
    </div>

    <script src="scripts/pages/photographer.js"></script>
    <script src="scripts/utils/contactForm.js"></script>
  </body>
</html>
